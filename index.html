<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G·A·R·E·D Breakout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    color: #e0e0e0;
    overflow: hidden;
  }

  h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: 3rem;
    letter-spacing: 0.4em;
    color: #f5f5f5;
    text-shadow: 0 0 20px rgba(255,200,50,0.6), 0 0 40px rgba(255,200,50,0.2);
    margin-bottom: 6px;
  }

  #subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: #888;
    margin-bottom: 16px;
  }

  #hud {
    display: flex;
    gap: 40px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: #aaa;
  }

  #hud span { color: #ffc832; }

  canvas {
    border: 1px solid #2a2a3a;
    box-shadow: 0 0 40px rgba(100,100,255,0.08), 0 0 80px rgba(100,100,255,0.04);
    border-radius: 4px;
    display: block;
  }

  #order-display {
    display: flex;
    gap: 12px;
    margin-top: 14px;
  }

  .order-letter {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.3rem;
    border: 1px solid #333;
    border-radius: 4px;
    color: #444;
    transition: all 0.3s;
  }

  .order-letter.hit {
    border-color: #ffc832;
    color: #ffc832;
    box-shadow: 0 0 10px rgba(255,200,50,0.4);
  }

  .order-letter.next {
    border-color: #64b5f6;
    color: #64b5f6;
    box-shadow: 0 0 10px rgba(100,181,246,0.4);
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { box-shadow: 0 0 6px rgba(100,181,246,0.3); }
    to   { box-shadow: 0 0 14px rgba(100,181,246,0.7); }
  }

  #msg {
    margin-top: 14px;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: #888;
    height: 20px;
  }

  #restart-btn {
    margin-top: 14px;
    padding: 8px 28px;
    background: transparent;
    border: 1px solid #ffc832;
    color: #ffc832;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    border-radius: 3px;
    display: none;
    transition: all 0.2s;
  }

  #restart-btn:hover {
    background: rgba(255,200,50,0.1);
    box-shadow: 0 0 12px rgba(255,200,50,0.3);
  }
</style>
</head>
<body>

<h1>G·A·R·E·D</h1>
<div id="subtitle">HIT THE BLOCKS IN ORDER</div>

<div id="hud">
  SCORE: <span id="score-val">0</span>
  &nbsp;&nbsp;|&nbsp;&nbsp;
  LIVES: <span id="lives-val">3</span>
</div>

<canvas id="c" width="480" height="400"></canvas>

<div id="order-display">
  <div class="order-letter next" id="ol-0">G</div>
  <div class="order-letter" id="ol-1">A</div>
  <div class="order-letter" id="ol-2">R</div>
  <div class="order-letter" id="ol-3">E</div>
  <div class="order-letter" id="ol-4">D</div>
</div>

<div id="msg">PRESS SPACE OR CLICK TO LAUNCH</div>
<button id="restart-btn" onclick="init()">RESTART</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const SEQUENCE = ['G','A','R','E','D'];
const COLORS = {
  G: { main:'#50fa7b', glow:'rgba(80,250,123,0.5)' },
  A: { main:'#ff79c6', glow:'rgba(255,121,198,0.5)' },
  R: { main:'#ff5555', glow:'rgba(255,85,85,0.5)' },
  E: { main:'#f1fa8c', glow:'rgba(241,250,140,0.5)' },
  D: { main:'#bd93f9', glow:'rgba(189,147,249,0.5)' },
};

let ball, paddle, blocks, lives, score, nextIdx, launched, gameOver, won;
let keys = {};

function makeBlocks() {
  const bW = 64, bH = 36, gap = 20;
  const totalW = SEQUENCE.length * bW + (SEQUENCE.length - 1) * gap;
  const startX = (W - totalW) / 2;
  return SEQUENCE.map((letter, i) => ({
    letter,
    x: startX + i * (bW + gap),
    y: 80,
    w: bW,
    h: bH,
    alive: true,
    hit: false,
  }));
}

function init() {
  paddle = { x: W/2 - 45, y: H - 30, w: 90, h: 12 };
  ball = { x: paddle.x + paddle.w/2, y: paddle.y - 10, r: 7, vx: 0, vy: 0, onPaddle: true };
  blocks = makeBlocks();
  lives = 3;
  score = 0;
  nextIdx = 0;
  launched = false;
  gameOver = false;
  won = false;

  document.getElementById('score-val').textContent = 0;
  document.getElementById('lives-val').textContent = 3;
  document.getElementById('msg').textContent = 'PRESS SPACE OR CLICK TO LAUNCH';
  document.getElementById('restart-btn').style.display = 'none';
  updateOrderDisplay();
}

function updateOrderDisplay() {
  SEQUENCE.forEach((_, i) => {
    const el = document.getElementById('ol-' + i);
    el.className = 'order-letter';
    if (i < nextIdx) el.classList.add('hit');
    else if (i === nextIdx) el.classList.add('next');
  });
}

function resetBall() {
  ball = { x: paddle.x + paddle.w/2, y: paddle.y - 10, r: 7, vx: 0, vy: 0, onPaddle: true };
  launched = false;
  document.getElementById('msg').textContent = 'PRESS SPACE OR CLICK TO LAUNCH';
}

function setMsg(text, color='#888') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.color = color;
}

function endGame(win) {
  gameOver = true;
  won = win;
  if (win) setMsg('✦ YOU SPELLED GARED! YOU WIN! ✦', '#ffc832');
  else setMsg('GAME OVER', '#ff5555');
  document.getElementById('restart-btn').style.display = 'inline-block';
}

function update() {
  if (gameOver) return;

  // Ball sits on paddle until launched
  if (ball.onPaddle) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    if (launched) {
      // Launch angle based on paddle position: left side goes left, right goes right
      const offset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 to 1
      ball.vx = offset * 4;
      // Clamp so it's never purely vertical
      if (Math.abs(ball.vx) < 1) ball.vx = (Math.random() > 0.5 ? 1 : -1) * 1;
      ball.vy = -5;
      ball.onPaddle = false;
    }
    return;
  }

  if (!launched) return;

  // Move ball
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall collisions
  if (ball.x - ball.r < 0)  { ball.x = ball.r;      ball.vx *= -1; }
  if (ball.x + ball.r > W)  { ball.x = W - ball.r;  ball.vx *= -1; }
  if (ball.y - ball.r < 0)  { ball.y = ball.r;       ball.vy *= -1; }

  // Paddle collision
  if (
    ball.y + ball.r >= paddle.y &&
    ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.vy) &&
    ball.x >= paddle.x &&
    ball.x <= paddle.x + paddle.w
  ) {
    ball.vy = -Math.abs(ball.vy);
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx = hit * 5;
    ball.y = paddle.y - ball.r;
  }

  // Block collisions
  for (let b of blocks) {
    if (!b.alive) continue;
    if (
      ball.x + ball.r > b.x &&
      ball.x - ball.r < b.x + b.w &&
      ball.y + ball.r > b.y &&
      ball.y - ball.r < b.y + b.h
    ) {
      ball.vy *= -1;
      const expectedLetter = SEQUENCE[nextIdx];
      if (b.letter === expectedLetter) {
        b.alive = false;
        nextIdx++;
        score += 100;
        document.getElementById('score-val').textContent = score;
        updateOrderDisplay();
        if (nextIdx === SEQUENCE.length) endGame(true);
        else setMsg('NEXT: ' + SEQUENCE[nextIdx], '#64b5f6');
      } else {
        // Wrong order — lose
        endGame(false);
        setMsg('WRONG ORDER! HIT ' + SEQUENCE[nextIdx] + ' FIRST!', '#ff5555');
      }
      break;
    }
  }

  // Ball lost
  if (ball.y - ball.r > H) {
    lives--;
    document.getElementById('lives-val').textContent = lives;
    if (lives <= 0) endGame(false);
    else resetBall();
  }
}

function drawBlock(b) {
  if (!b.alive) return;
  const c = COLORS[b.letter];
  ctx.save();

  // Glow
  ctx.shadowColor = c.glow;
  ctx.shadowBlur = 18;
  ctx.fillStyle = c.main + '22';
  ctx.fillRect(b.x, b.y, b.w, b.h);

  // Border
  ctx.strokeStyle = c.main;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(b.x + 0.75, b.y + 0.75, b.w - 1.5, b.h - 1.5);

  // Letter
  ctx.shadowBlur = 0;
  ctx.fillStyle = c.main;
  ctx.font = 'bold 22px "Bebas Neue", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.letter, b.x + b.w/2, b.y + b.h/2 + 1);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Blocks
  blocks.forEach(drawBlock);

  // Paddle
  const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
  pg.addColorStop(0, '#90caf9');
  pg.addColorStop(1, '#1565c0');
  ctx.fillStyle = pg;
  ctx.shadowColor = 'rgba(144,202,249,0.5)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Ball
  const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(1, '#ffc832');
  ctx.fillStyle = bg;
  ctx.shadowColor = 'rgba(255,200,50,0.7)';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Game over overlay
  if (gameOver) {
    ctx.fillStyle = won ? 'rgba(255,200,50,0.06)' : 'rgba(255,50,50,0.06)';
    ctx.fillRect(0, 0, W, H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Controls
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Space') {
    if (!launched && !gameOver) launched = true;
  }
  keys[e.key] = true;
});
document.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('click', () => {
  if (!launched && !gameOver) launched = true;
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});

// Keyboard paddle movement
setInterval(() => {
  if (keys['ArrowLeft'])  paddle.x = Math.max(0, paddle.x - 6);
  if (keys['ArrowRight']) paddle.x = Math.min(W - paddle.w, paddle.x + 6);
}, 16);

init();
loop();
</script>
</body>
</html>
